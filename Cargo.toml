[package]
name = "custodian-kernel"
version = "0.1.0"
edition = "2024"
authors = ["Vibe Coding Agency LLC"]
description = "Rust port of custodian-kernel: kernel-enforced authority and spend control for AI agents"
license = "MIT"
repository = "https://github.com/KeyArgo/custodian-kernel"
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dependencies.sqlx]
version = "0.8"
features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"]

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "custodian_kernel"
path = "src/lib.rs"
